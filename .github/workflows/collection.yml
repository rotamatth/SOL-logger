name: Study collection
on:
  # Every pull request (drafts included) is checked on each push. Direct pushes
  # are checked on the shared branches; anyone can also run it from the Actions tab.
  push:
    branches: [main, matthias-dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request replaces its running check. Runs on the
  # shared branches always finish, so every merged commit keeps a complete result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    name: Dashboard browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOL_REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            logger/search-app/requirements*.txt
            logger/search-app/requirements.lock
      - run: python -m pip install -r logger/search-app/requirements-browser-test.txt
      - run: python -m pip check
      - name: Install matching Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Require dashboard browser regressions
        run: python -m pytest logger/search-app/tests/test_*browser.py -q
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            logger/search-app/requirements*.txt
            logger/search-app/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r logger/search-app/requirements-test.txt
      - run: python -m pip check
      - name: Collection, failure recovery and logging contracts
        run: python -m pytest logger/search-app/tests -q
      - name: Validate production container configuration
        run: docker compose -f logger/docker-compose.yml config --quiet
      - name: Build release image
        run: docker build --build-arg SOL_GIT_COMMIT="$GITHUB_SHA" -t sol-collection:test logger/search-app
      - name: Preserve attempt and upload receipt across container replacement
        run: |
          volume="sol-collection-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm -v "$volume:/checks" sol-collection:test python tools/check_collection_restart.py seed --root /checks/study
          docker run --rm -v "$volume:/checks" sol-collection:test python tools/check_collection_restart.py verify --root /checks/study
          docker run --rm -v "$volume:/checks" sol-collection:test python tools/backup_study.py create /checks/study.zip --root /checks/study
          docker run --rm -v "$volume:/checks" sol-collection:test python tools/backup_study.py restore /checks/study.zip --root /checks/restored
          docker run --rm -v "$volume:/checks" sol-collection:test python tools/check_collection_restart.py verify --root /checks/restored
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 'true' only when the secret is available; never for pull requests from forks.
      SONAR_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets SonarQube Cloud tell new code from existing code.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            logger/search-app/requirements*.txt
            logger/search-app/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r logger/search-app/requirements-quality.txt
      - run: python -m pip check
      - name: Python lint (Ruff, rules in ruff.toml)
        run: ruff check --output-format=github logger/search-app
      - name: JavaScript syntax
        run: |
          for file in logger/search-app/static/*.js logger/search-app/research_dashboard/static/*.js; do
            node --check "$file"
          done
      - name: Known vulnerabilities in production dependencies
        run: pip-audit -r logger/search-app/requirements.lock --no-deps --disable-pip --progress-spinner off
      - name: Tests with coverage (settings in .coveragerc)
        run: python -m pytest logger/search-app/tests -q --ignore-glob='*browser.py' --cov --cov-report=xml --cov-report=term
      - name: SonarQube Cloud token required
        # Set the repository variable SONAR_REQUIRED=true once SonarQube Cloud is set up,
        # so a missing token fails instead of silently skipping the quality gate.
        if: vars.SONAR_REQUIRED == 'true' && env.SONAR_CONFIGURED != 'true'
        run: |
          echo "::error::SonarQube Cloud is required but SONAR_TOKEN is unavailable. Push the branch to this repository (not a fork)."
          exit 1
      - name: SonarQube Cloud analysis and quality gate
        if: env.SONAR_CONFIGURED == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Fail this job when the quality gate fails, so it can block the merge.
          args: -Dsonar.qualitygate.wait=true
