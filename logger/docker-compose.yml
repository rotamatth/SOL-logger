services:
  search_app:
    build:
      context: ./search-app
      args:
        SOL_GIT_COMMIT: "${SOL_GIT_COMMIT:-unknown}"
        SOL_APP_VERSION: "${SOL_APP_VERSION:-v2}"
    init: true
    ports:
      - "${HOST_BIND:-0.0.0.0}:${APP_PORT:-7001}:7001"
    volumes:
      - ./search-app/data:/app/data:ro
      - ./logs-v2:/app/logs
      - ./logs:/app/legacy_logs:ro
      - ./research-state:/app/research_state
      - ./research-secrets:/app/research-secrets:ro
      - ${API_KEYS_FILE:-./search-app/API_keys.json}:/app/API_keys.json:ro
      - ${GOOGLE_SERVICE_ACCOUNT_FILE:-./search-app/service_account.json}:/app/service_account.json:ro
    environment:
      SEARCH_BACKEND: "${SEARCH_BACKEND:-vertex}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/app/service_account.json}"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
      SOL_LOG_DIR: "/app/logs"
      RESEARCH_LEGACY_LOG_DIR: "/app/legacy_logs"
      RESEARCH_STATE_DIR: "/app/research_state"
      RESEARCH_PASSWORD_HASH_FILE: "/app/research-secrets/password.hash"
      RESEARCH_COOKIE_SECURE: "${RESEARCH_COOKIE_SECURE:-0}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      VERTEX_PROJECT_NUMBER: "${VERTEX_PROJECT_NUMBER:-}"
      VERTEX_LOCATION: "${VERTEX_LOCATION:-global}"
      VERTEX_ENGINE_ID: "${VERTEX_ENGINE_ID:-}"
      VERTEX_DATA_STORE_ID: "${VERTEX_DATA_STORE_ID:-}"
      VERTEX_LANGUAGE_CODE: "${VERTEX_LANGUAGE_CODE:-it}"
      VERTEX_AUTOCOMPLETE_QUERY_MODEL: "${VERTEX_AUTOCOMPLETE_QUERY_MODEL:-search-history}"
      SERP_AUTOCOMPLETE_HL: "${SERP_AUTOCOMPLETE_HL:-it}"
      SERP_AUTOCOMPLETE_GL: "${SERP_AUTOCOMPLETE_GL:-it}"
      SERP_AUTOCOMPLETE_CLIENT: "${SERP_AUTOCOMPLETE_CLIENT:-gws-wiz}"  # default gws-wiz (google.com-style); override per host env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7001/welcome >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    restart: unless-stopped

  # Local PyTerrier/BM25 backend. Off by default — only starts when the
  # `pyterrier` profile is activated:
  #   docker compose --profile pyterrier up --build
  # On the USI server we run Vertex-only, so this never starts there.
  search_engine:
    profiles: ["pyterrier"]
    build: ./search-engine
    expose:
      - "7002"
    volumes:
      - ./search-engine/index:/app/index
    tty: true
    environment:
      WMODEL: BM25
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
