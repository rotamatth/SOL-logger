# Local UI development only; opt in using scripts/local-ui.sh.
# !override requires Docker Compose 2.24.4 or later.
services:
  search_app:
    ports: !override
      - "127.0.0.1:${LOCAL_UI_PORT:-7001}:7001"
    command:
      - flask
      - --app
      - search_app
      - run
      - --host=0.0.0.0
      - --port=7001
      - --debug
      - --no-debugger
    environment:
      FLASK_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./search-app/search_app.py:/app/search_app.py:ro
      - ./search-app/search_backend.py:/app/search_backend.py:ro
      - ./search-app/forms.py:/app/forms.py:ro
      - ./search-app/templates:/app/templates:ro
      - ./search-app/static:/app/static:ro
      - ui_logs:/app/logs
      - ui_sessions:/app/flask_session
    restart: "no"

volumes:
  ui_logs:
  ui_sessions:
