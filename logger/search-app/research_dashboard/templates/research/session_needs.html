{% macro needs_links(study_session, needs) %}{% if needs %}<p class="session-needs"><span>{{ t('needs_label') }}</span>{% for need in needs %}{% set anchor = {'date': 'prepare-details', 'ids': 'prepare-participants', 'questions': 'prepare-questions'}[need] %}<a href="{{ u('prepare_page', grade=study_session.grade, year=study_session.school_year or None, session=study_session.id, _anchor=anchor) }}">{{ t('needs_' ~ need) }}</a>{% endfor %}</p>{% endif %}{% endmacro %}
