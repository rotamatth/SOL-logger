{% extends "layout.html" %}
{% block title %}Web Page{% endblock %}
{% block content %}

<div class="app-page">
  <div class="app-toolbar">
    <a href="{{ url_for('result', query=query, page=page) }}" id="viewer-back-btn" class="app-btn app-btn-back">
        &larr; Indietro
    </a>
    {% include "search_first_answer.html" %}
    <button type="button"
            onclick="openFeedbackModal()"
            class="app-btn app-btn-warm"
            id="end-task-btn">
      Scrivi la risposta
    </button>
  </div>

  <section class="app-panel webpage-panel">
    <iframe
        id="webpage-frame"
        src="{{ url }}"
        sandbox="allow-same-origin allow-scripts allow-forms"
        title="Web page viewer">
    </iframe>
    <div class="sol-loader is-pending" id="iframe-loader" aria-live="polite">
      <div class="sol-loader__spinner" aria-hidden="true"></div>
      <div class="sol-loader__text">Caricamento…</div>
    </div>
  </section>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const viewedUrl = {{ url|tojson }};
    if (!window.studyLogger) return;

    const windowLocationAtOpen = location.href;
    const webpageOpenedAt = Date.now();
    let currentKnownIframeUrl = viewedUrl;
    const iframeHistory = [];
    let initialLoadHandled = false;
    let programmaticBackInFlight = false;
    let trackingLimitedLogged = false;
    let closedLogged = false;

    studyLogger.logEvent("webpageOpened", { url: viewedUrl });
    studyLogger.logEvent("resourceViewStarted", {
        url: viewedUrl,
        windowLocation: windowLocationAtOpen
    });

    fetch("/iframe_check?url=" + encodeURIComponent(viewedUrl))
        .then(r => r.json())
        .then(d => {
            if (!window.studyLogger) return;
            const evt = d.blocked === true  ? "webpageLoadFailed"
                      : d.blocked === false ? "webpageLoadSucceeded"
                      :                        "webpageLoadCheckUnknown";
            studyLogger.logEvent(evt, { url: viewedUrl, reason: d.reason || null });
        })
        .catch(() => {
            if (!window.studyLogger) return;
            studyLogger.logEvent("webpageLoadCheckUnknown",
                                 { url: viewedUrl, reason: "fetch-error" });
        });

    function emitClosed(legacyReason, resourceReason) {
        if (!window.studyLogger || closedLogged) return;
        closedLogged = true;
        const dwellTimeMs = Date.now() - webpageOpenedAt;
        studyLogger.logEvent("webpageClosed", {
            url: viewedUrl,
            durationMs: dwellTimeMs,
            exitReason: legacyReason
        });
        studyLogger.logEvent("resourceViewEnded", {
            url: currentKnownIframeUrl,
            windowLocation: windowLocationAtOpen,
            dwellTimeMs,
            exitReason: resourceReason
        });
    }

    window.logOpenWebpageClosed = (reason) =>
        emitClosed(reason || "end-task-button", "end-task");

    const frame = document.getElementById("webpage-frame");
    const backBtn = document.getElementById("viewer-back-btn");

    const iframeLoader = document.getElementById("iframe-loader");
    let iframeLoaderShown = false;
    const iframeLoaderTimer = window.setTimeout(() => {
        if (iframeLoader) {
            iframeLoader.classList.remove("is-pending");
            iframeLoaderShown = true;
        }
    }, 250);

    function hideIframeLoader() {
        window.clearTimeout(iframeLoaderTimer);
        if (!iframeLoader) return;
        iframeLoader.classList.add("is-hidden");
        if (!iframeLoaderShown) iframeLoader.classList.add("is-pending");
    }

    if (frame) {
        frame.addEventListener("load", () => {
            hideIframeLoader();
            let readableUrl = null;
            try {
                readableUrl = frame.contentWindow.location.href;
            } catch (_) {
                if (!trackingLimitedLogged) {
                    trackingLimitedLogged = true;
                    studyLogger.logEvent("iframeNavigationTrackingLimited", {
                        reason: "cross-origin-access-blocked",
                        url: viewedUrl,
                        windowLocation: windowLocationAtOpen
                    });
                }
                return;
            }

            if (!initialLoadHandled) {
                initialLoadHandled = true;
                currentKnownIframeUrl = readableUrl;
                return;
            }

            if (programmaticBackInFlight) {
                programmaticBackInFlight = false;
                return;
            }

            if (readableUrl === currentKnownIframeUrl) return;

            const fromUrl = currentKnownIframeUrl;
            iframeHistory.push(fromUrl);
            currentKnownIframeUrl = readableUrl;
            studyLogger.logEvent("iframeNavigation", {
                fromUrl,
                toUrl: readableUrl,
                windowLocation: windowLocationAtOpen
            });
        });
    }

    if (backBtn && frame) {
        backBtn.addEventListener("click", (e) => {
            if (iframeHistory.length === 0) return;
            let canProbe = false;
            try { void frame.contentWindow.location.href; canProbe = true; } catch (_) {}
            if (!canProbe) return;

            e.preventDefault();
            e.stopImmediatePropagation();
            const fromUrl = currentKnownIframeUrl;
            const toUrl = iframeHistory.pop();
            currentKnownIframeUrl = toUrl;
            programmaticBackInFlight = true;
            frame.src = toUrl;
            studyLogger.logEvent("iframeBackNavigation", {
                fromUrl,
                toUrl,
                windowLocation: windowLocationAtOpen
            });
        }, true);
        // Capture phase: runs before the bubble-phase handlers in logger.js
        // (customBackButtonClicked) and below (emitClosed). Suppression via
        // stopImmediatePropagation is only robust because those handlers are
        // bubble-phase; an earlier capture-phase listener elsewhere could
        // still run before this one (registration order applies within a
        // single phase).
    }

    backBtn?.addEventListener("click", () => emitClosed("back-button", "custom-back"));
    window.addEventListener("pagehide", () => {
        emitClosed("pagehide", "page-unload");
        hideIframeLoader();
    });
});
</script>
{% endblock %}
