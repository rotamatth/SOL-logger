{% extends "layout.html" %}
{% block content %}
<div class="app-page">
  <div class="app-toolbar">
    <a href="{{ url_for('welcome') }}" class="app-btn app-btn-back">&larr; Indietro</a>
  </div>

  <section class="app-panel id-panel">
    <div class="id-form-wrap">
      <p class="form-label-strong">Seleziona il numero che trovi scritto dietro al tablet</p>
    <form method="POST" id="enter-id-form">
        <select name="user_id" class="form-control app-input id-input" id="id-box" required>
            <option value="" disabled selected>Seleziona il numero…</option>
            {% for id in valid_ids %}
            <option value="{{ id }}">{{ id }}</option>
            {% endfor %}
        </select>
        <p id="error-message" class="form-error" style="display: none;">Seleziona un numero</p>
        {% if start_error %}<p class="form-error" role="alert">{{ start_error }}</p>{% endif %}
        <button class="app-btn app-btn-primary" id="continue-btn" type="submit">Continua</button>
    </form>
    </div>
  </section>
</div>

<script>
  const validIDs = {{ valid_ids | tojson }};
  const input = document.getElementById("id-box");
  const form = document.getElementById("enter-id-form");
  const errorMsg = document.getElementById("error-message");

  input.addEventListener("change", () => {
    errorMsg.style.display = "none";
  });

  form.addEventListener("submit", function(e) {
    if (!validIDs.includes(input.value)) {
      errorMsg.style.display = "block";
      e.preventDefault();
    }
  });
</script>

{% endblock %}
