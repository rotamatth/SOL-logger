{% extends "layout.html" %}
{% block title %}Grazie{% endblock %}
{% block content %}

<div class="app-page completion-page">
  <section class="app-panel completion-panel">
    <div class="completion-container">
    <h2>Complimenti, hai completato l'esperimento!</h2>
    <p>Hai risposto a tutte le domande. Grazie per la tua partecipazione!</p>
    <p id="end-status-msg" class="is-visible">Premi il pulsante qui sotto per concludere l'esperimento.</p>
    <button id="finish-experiment-btn" class="app-btn app-btn-primary is-visible">Salva e chiudi</button>
    </div>
  </section>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    if (window.studyLogger) {
        studyLogger.logEvent("sessionCompleted", {
            totalTasks: {{ total_tasks }}
        });
    }

});

document.getElementById("finish-experiment-btn").addEventListener("click", async function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = "Salvataggio...";

    try {
        if (!window.studyLogger) throw new Error('Logging is unavailable');
        if (window.studyLogger) {
            if (!window.experimentFinishedLogged && !studyLogger.logs.some(event => event.type === "experimentFinished")) {
                studyLogger.logEvent("experimentFinished");
                window.experimentFinishedLogged = true;
            }
            await studyLogger.sendLogs();
        }

        btn.textContent = "Reindirizzamento...";
        btn.style.background = "#5f6368";
        document.getElementById("end-status-msg").textContent = "I tuoi dati sono stati salvati. Ora torni alla pagina iniziale.";

        if (typeof clearClientData === 'function') {
            clearClientData();
        }
        window.location.href = "{{ url_for('welcome') }}?reset=1";
    } catch (err) {
        console.error("Error saving final logs:", err);
        btn.textContent = "Riprova";
        btn.disabled = false;
        document.getElementById("end-status-msg").textContent = "Si e verificato un errore durante il salvataggio. Riprova.";
        document.getElementById("end-status-msg").style.color = "#EA4335";
    }
});
</script>
{% endblock %}
