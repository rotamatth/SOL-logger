<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ 'Cominciamo!' if welcome_lines else 'Domanda ' ~ task_number }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css', v='child-pages-2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='first-answer.css', v='child-pages-2') }}">
</head>
<body class="first-answer-page">
{% include "test_run_banner.html" %}
  <main class="first-answer-panel task-intro">
    {% if welcome_lines %}
    <h1 class="task-intro-title">Cominciamo!</h1>
    {% for line in welcome_lines %}<p class="task-intro-text">{{ line }}</p>{% endfor %}
    <a id="task-intro-continue" class="app-btn app-btn-primary" href="{{ next_url }}">Continua</a>
    {% else %}
    <span class="task-intro-number" aria-label="Domanda {{ task_number }}">#{{ task_number }}</span>
    <p class="task-intro-text">Prova a rispondere alla domanda:</p>
    <h1>{{ topic }}</h1>
    <p class="task-intro-text">Pensi di sapere la risposta?</p>
    <a id="task-intro-continue" class="app-btn app-btn-primary" href="{{ next_url }}">Inizia</a>
    {% endif %}
  </main>
</body>
</html>
