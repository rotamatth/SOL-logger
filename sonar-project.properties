# SonarQube Cloud analysis, run by the "Code quality" CI job once the SONAR_TOKEN
# secret exists. Organization and project key come from SonarQube Cloud after the
# repository is imported: change them here if SonarQube Cloud shows other values.
sonar.organization=rotamatth
sonar.projectKey=rotamatth_SOL-logger
sonar.projectName=SOL-logger

# Only application code is analysed and uploaded: never logs, study data or secrets.
# Those are not tracked in Git and do not exist in the CI checkout; the key files are
# also excluded in case the scanner is ever run from a working copy that has them.
sonar.sources=logger/search-app
sonar.exclusions=logger/search-app/tests/**,logger/search-app/data/**,logger/search-app/static/puzzle_pieces/**,**/API_keys.json,**/service_account*.json,**/*.env,**/research_state/**,**/flask_session/**,**/logs*/**
sonar.tests=logger/search-app/tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# Coverage is measured for Python. Templates, scripts and styles are analysed for
# issues but have no coverage requirement (browser tests exercise them instead).
sonar.coverage.exclusions=**/*.js,**/*.css,**/*.html,logger/search-app/tools/**
